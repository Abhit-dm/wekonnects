<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donors | WeKonnects</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'] }, colors: { brandOrange: '#FF6B00', brandBlue: '#0F2046', brandWhite: '#FFFFFF', brandLightGray: '#F8F9FA', bloodRed: '#E53E3E' } } } }
    </script>
</head>
<body class="bg-brandLightGray text-brandBlue font-sans antialiased flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <div class="relative pt-32 pb-24 bg-brandBlue mt-10 border-b-8 border-bloodRed">
        <div class="absolute inset-0 opacity-10 bg-[url('https://images.unsplash.com/photo-1615461066841-6116e6e05062?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10" data-aos="zoom-in">
            <h1 class="text-5xl md:text-6xl font-extrabold text-brandWhite mb-6">WeKonnects <span class="text-bloodRed drop-shadow-md">Blood Camp</span></h1>
            <p class="text-xl text-blue-200 font-medium max-w-3xl mx-auto leading-relaxed">
                Our network extends beyond business. Find active WeKonnects members ready to step up and donate blood when our community needs it most.
            </p>
        </div>
    </div>

    <section class="py-12 bg-brandWhite shadow-md relative z-20">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-brandWhite p-6 rounded-3xl shadow-xl flex flex-col md:flex-row gap-4 border border-gray-100 -mt-24">
                <select id="bloodGroupSelect" class="w-full md:flex-grow px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:border-bloodRed focus:outline-none text-brandBlue font-bold text-lg cursor-pointer">
                    <option value="">Show All Blood Groups</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
                <button onclick="fetchDonors()" class="w-full md:w-auto bg-bloodRed text-brandWhite font-extrabold text-lg px-10 py-4 rounded-xl hover:bg-red-700 transition shadow-lg whitespace-nowrap">
                    Search Donors
                </button>
            </div>
        </div>
    </section>

    <main class="flex-grow py-16 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <div id="donorLoader" class="text-center py-10 hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-bloodRed mx-auto"></div>
                <p class="mt-4 text-brandBlue font-bold">Scanning member database...</p>
            </div>

            <div id="donorsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script> 
        AOS.init({ once: true }); 
        fetch('header.html?v=5').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
        fetch('footer.html?v=5').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);

        // Fetch Donors from Backend API
        function fetchDonors() {
            const selectedGroup = document.getElementById('bloodGroupSelect').value;
            const grid = document.getElementById('donorsGrid');
            const loader = document.getElementById('donorLoader');
            
            grid.innerHTML = ''; // Clear current grid
            loader.classList.remove('hidden'); // Show loading spinner

            // Call the api_engine we just created!
            fetch(`api_engine.php?action=get_blood_donors&group=${encodeURIComponent(selectedGroup)}`)
                .then(res => res.json())
                .then(donors => {
                    loader.classList.add('hidden');
                    
                    if(donors.error) {
                        grid.innerHTML = `<div class="col-span-full text-center text-red-500 font-bold py-10">Database Error: ${donors.error}</div>`;
                        return;
                    }

                    if(donors.length === 0) {
                        grid.innerHTML = `
                            <div class="col-span-full text-center py-10 bg-brandWhite rounded-3xl shadow-sm border border-gray-100">
                                <div class="text-5xl mb-4">🩸</div>
                                <h3 class="text-2xl font-bold text-brandBlue mb-2">No donors found.</h3>
                                <p class="text-gray-500 font-medium text-lg">We currently don't have any active members matching this exact blood group.</p>
                            </div>
                        `;
                        return;
                    }

                    // Generate a card for each donor found in the database
                    donors.forEach((donor, index) => {
                        // Handle missing profile pictures
                        let photoUrl = donor.profile_photo;
                        if(!photoUrl || photoUrl === 'default.png') {
                            photoUrl = `https://ui-avatars.com/api/?name=${donor.first_name}+${donor.last_name}&background=0F2046&color=fff&size=150`;
                        } else {
                            // Pointing to your backend uploads folder (adjust path if necessary)
                            photoUrl = `bms/assets/uploads/profiles/${photoUrl}`; 
                        }

                        let city = donor.city ? donor.city : 'Location Not Provided';

                        grid.innerHTML += `
                            <div class="bg-brandWhite rounded-3xl overflow-hidden shadow-md hover:shadow-xl transition duration-300 border border-gray-100 flex flex-col" data-aos="fade-up" data-aos-delay="${(index % 4) * 50}">
                                <div class="p-6 text-center relative flex-grow">
                                    <div class="absolute top-4 right-4 bg-bloodRed text-white font-black text-xl px-3 py-1 rounded-lg shadow-sm border border-red-700">
                                        ${donor.blood_group}
                                    </div>
                                    <img src="${photoUrl}" alt="${donor.first_name}" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-gray-50 object-cover shadow-sm">
                                    <h3 class="text-xl font-extrabold text-brandBlue">${donor.first_name} ${donor.last_name}</h3>
                                    <p class="text-gray-500 font-medium text-sm mb-4 flex justify-center items-center">
                                        <span class="mr-1">📍</span> ${city}
                                    </p>
                                </div>
                                <div class="grid grid-cols-2 border-t border-gray-100">
                                    <a href="tel:${donor.phone}" class="py-4 text-center text-brandBlue font-bold hover:bg-gray-50 transition border-r border-gray-100 flex justify-center items-center">
                                        <svg class="w-5 h-5 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                        Call
                                    </a>
                                    <a href="https://wa.me/91${donor.phone}" target="_blank" class="py-4 text-center text-green-600 font-bold hover:bg-green-50 transition flex justify-center items-center">
                                        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>\r\n                                        WhatsApp\r\n                                    </a>\r\n                                </div>\r\n                            </div>\r\n                        `;
                    });
                }).catch(err => {
                    loader.classList.add('hidden');
                    grid.innerHTML = `<div class="col-span-full text-center text-red-500 font-bold py-10">Failed to connect to the database. Make sure api_engine.php is uploaded!</div>`;
                });
        }

        // Fetch all donors automatically when the page loads
        document.addEventListener('DOMContentLoaded', fetchDonors);
    </script>
</body>
</html>
